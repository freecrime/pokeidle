<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PokéIdle — Redirecting…</title>
  <meta http-equiv="refresh" content="5;url=https://freecrime.github.io/pokeidletestserver/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #080911;
      --accent: #a78bfa;
      --accentd:#7c6af7;
      --text:   #f0f0fb;
      --muted:  #4e4e72;
      --circ:   238.76; /* 2π × r38 */
    }

    html {
      height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100%;
      background: transparent;
      color: var(--text);
      font-family: 'Space Grotesk', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }



    /* ── layout ─────────────────────────── */
    .wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px;
      max-width: 360px;
      width: 100%;
      gap: 0;
    }

    /* ── site label ─────────────────────── */
    .label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 44px;
    }

    /* ── ring ───────────────────────────── */
    .ring-wrap {
      position: relative;
      width: 108px;
      height: 108px;
      margin-bottom: 40px;
    }

    .ring {
      width: 108px;
      height: 108px;
      transform: rotate(-90deg);
    }

    .ring .track {
      fill: none;
      stroke: rgba(167, 139, 250, 0.1);
      stroke-width: 2.5;
    }

    .ring .arc {
      fill: none;
      stroke: var(--accent);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-dasharray: var(--circ);
      stroke-dashoffset: 0;
      animation: drain 5s linear forwards;
      filter: drop-shadow(0 0 7px rgba(167, 139, 250, 0.55));
    }

    @keyframes drain {
      from { stroke-dashoffset: 0; }
      to   { stroke-dashoffset: 238.76; }
    }

    .count-num {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    /* ── headline ───────────────────────── */
    h1 {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1.1;
      margin-bottom: 10px;
    }

    .sub {
      font-size: 16px;
      font-weight: 400;
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: 36px;
    }

    /* ── CTA button ─────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 11px 22px;
      background: var(--accentd);
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid rgba(167, 139, 250, 0.25);
      transition: background 0.15s, transform 0.15s;
      margin-bottom: 22px;
    }

    .btn:hover  { background: var(--accent); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }

    /* ── destination url ────────────────── */
    .dest {
      font-size: 12.5px;
      color: var(--muted);
      word-break: break-all;
    }

    .dest a {
      color: var(--accent);
      text-decoration: none;
      opacity: 0.8;
      transition: opacity 0.15s;
    }

    .dest a:hover { opacity: 1; text-decoration: underline; }

    @media (prefers-reduced-motion: reduce) {
      .ring .arc { animation: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">

    <span class="label">PokéIdle</span>

    <div class="ring-wrap">
      <svg class="ring" viewBox="0 0 108 108" aria-hidden="true">
        <circle class="track" cx="54" cy="54" r="38"/>
        <circle class="arc"   cx="54" cy="54" r="38"/>
      </svg>
      <span class="count-num" id="n">5</span>
    </div>

    <h1>We've moved.</h1>
    <p class="sub">Our game has a new home.<br>Taking you there automatically.</p>

    <a class="btn" id="go" href="https://freecrime.github.io/pokeidletestserver/">
      Go now &nbsp;→
    </a>

    <span class="dest">
      <a href="https://freecrime.github.io/pokeidletestserver/">
        freecrime.github.io/pokeidletestserver
      </a>
    </span>

  </div>

  <script>
    (function () {
      var TARGET = 'https://freecrime.github.io/pokeidletestserver/';
      var goBtn   = document.getElementById('go');
      var destLinks = document.querySelectorAll('.dest a');
      goBtn.href = TARGET;
      destLinks.forEach(function(a){ a.href = TARGET; });

      var n  = 5;
      var el = document.getElementById('n');
      var t  = setInterval(function () {
        n--;
        if (el) el.textContent = Math.max(0, n);
        if (n <= 0) { clearInterval(t); location.replace(TARGET); }
      }, 1000);

      // Hard fallback if the interval is throttled in a background tab
      setTimeout(function () { location.replace(TARGET); }, 5300);
    })();
  </script>
</body>
</html>
