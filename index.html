<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PokéIdle — Redirecting…</title>
  <!-- No-JS fallback: still bounces after 3s -->
  <meta http-equiv="refresh" content="3;url=https://freecrime.github.io/pokeidletestserver/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root{ --bg:#0a0a1a; --bg2:#111128; --panel:#1a1a35; --accent:#4fc3f7; --gold:#ffd700; --text:#e0e0ff; --text2:#8888bb; }
    *{ box-sizing:border-box; margin:0; padding:0; }
    html,body{ height:100%; }
    body{
      background:radial-gradient(120% 90% at 50% 0%, #15153200 0%, transparent 60%), radial-gradient(circle at 50% 35%, var(--bg2), var(--bg) 70%);
      color:var(--text); font-family:'VT323',monospace; min-height:100%;
      display:flex; align-items:center; justify-content:center; padding:24px; overflow:hidden;
    }
    /* drifting starfield */
    .stars{ position:fixed; inset:0; pointer-events:none; opacity:.5;
      background-image:radial-gradient(1.5px 1.5px at 20% 30%, #fff, transparent), radial-gradient(1.5px 1.5px at 70% 60%, #cfe8ff, transparent), radial-gradient(1px 1px at 40% 80%, #fff, transparent), radial-gradient(1px 1px at 85% 20%, #ffe9a8, transparent), radial-gradient(1px 1px at 55% 15%, #fff, transparent);
      background-size:cover; animation:twinkle 4s ease-in-out infinite; }
    @keyframes twinkle{ 0%,100%{opacity:.35} 50%{opacity:.7} }

    .card{
      position:relative; width:100%; max-width:440px; text-align:center;
      background:linear-gradient(180deg, rgba(26,26,53,.9), rgba(17,17,40,.85));
      border:2px solid rgba(79,195,247,.35); border-radius:16px; padding:34px 28px 26px;
      box-shadow:0 0 40px rgba(79,195,247,.12), 0 18px 60px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.05) inset;
    }

    /* wiggling pokéball */
    .ball{
      width:84px; height:84px; margin:0 auto 18px; border-radius:50%; position:relative;
      border:5px solid #15151f; background:linear-gradient(#ee5253 0 50%, #f6f6f9 50% 100%);
      box-shadow:0 0 26px rgba(255,215,0,.25); transform-origin:50% 92%;
      animation:wiggle 1.2s ease-in-out infinite;
    }
    .ball::before{ content:''; position:absolute; left:-5px; right:-5px; top:calc(50% - 4px); height:8px; background:#15151f; }
    .ball::after{ content:''; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:24px; height:24px; border-radius:50%; background:#f6f6f9; border:5px solid #15151f; box-shadow:0 0 8px rgba(255,255,255,.5); }
    @keyframes wiggle{ 0%,100%{transform:rotate(0)} 18%{transform:rotate(-15deg)} 38%{transform:rotate(13deg)} 58%{transform:rotate(-8deg)} 78%{transform:rotate(5deg)} }

    h1{ font-family:'Press Start 2P',monospace; font-size:16px; color:var(--gold); letter-spacing:1px; text-shadow:0 0 16px rgba(255,215,0,.4); margin-bottom:14px; }
    .lead{ font-size:23px; color:var(--text); line-height:1.25; margin-bottom:6px; }
    .sub{ font-size:18px; color:var(--text2); line-height:1.3; margin-bottom:20px; }
    .count{ font-family:'Press Start 2P',monospace; font-size:13px; color:var(--accent); }
    .count b{ color:var(--gold); }

    .track{ height:8px; border-radius:99px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.08); overflow:hidden; margin:8px 0 22px; }
    .fill{ height:100%; width:0; border-radius:99px; background:linear-gradient(90deg, var(--gold), var(--accent)); box-shadow:0 0 12px rgba(79,195,247,.5); animation:fill 3s linear forwards; }
    @keyframes fill{ from{width:0} to{width:100%} }

    .go{
      display:inline-block; font-family:'VT323',monospace; font-size:21px; letter-spacing:1px; cursor:pointer;
      color:#06121a; background:linear-gradient(180deg, var(--gold), #f0a800); border:none; border-radius:10px;
      padding:11px 26px; text-decoration:none; box-shadow:0 6px 18px rgba(255,180,0,.3), 0 1px 0 rgba(255,255,255,.4) inset; transition:transform .15s, box-shadow .15s;
    }
    .go:hover{ transform:translateY(-2px); box-shadow:0 10px 26px rgba(255,180,0,.45), 0 1px 0 rgba(255,255,255,.5) inset; }
    .go:active{ transform:translateY(0); }
    .url{ display:block; margin-top:16px; font-size:15px; color:var(--text2); word-break:break-all; }
    .url a{ color:var(--accent); text-decoration:none; }
    .tag{ margin-top:18px; font-family:'Press Start 2P',monospace; font-size:6px; color:#4a4a72; letter-spacing:1px; }
  </style>
</head>
<body>
  <div class="stars"></div>
  <div class="card">
    <div class="ball"></div>
    <h1>POKÉIDLE</h1>
    <div class="lead">We've merged into <b style="color:var(--gold)">one version!</b></div>
    <div class="sub">This page has moved. Taking you to the latest build…</div>
    <div class="track"><div class="fill"></div></div>
    <div class="count">Redirecting in <b id="n">3</b>s…</div>
    <div style="margin-top:20px">
      <a class="go" id="go" href="https://freecrime.github.io/pokeidletestserver/">▶ &nbsp;GO NOW</a>
    </div>
    <span class="url">Bookmark the new home:<br><a href="https://freecrime.github.io/pokeidletestserver/">freecrime.github.io/pokeidletestserver</a></span>
    <div class="tag">↻ AUTO-REDIRECT</div>
  </div>

  <script>
    (function () {
      var TARGET = 'https://freecrime.github.io/pokeidletestserver/';
      document.getElementById('go').href = TARGET;
      var n = 3, el = document.getElementById('n');
      var t = setInterval(function () {
        n--;
        if (el) el.textContent = Math.max(0, n);
        if (n <= 0) { clearInterval(t); location.replace(TARGET); }   // replace() so Back won't return here
      }, 1000);
      // hard fallback in case the interval is throttled in a background tab
      setTimeout(function () { location.replace(TARGET); }, 3200);
    })();
  </script>
</body>
</html>
